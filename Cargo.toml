[package]
name = "ali-acs"
version = "0.8.0"
edition = "2024"
license = "MIT"
description = "A type-safe, idiomatic Rust SDK for Alibaba Cloud services with complete protocol coverage"
repository = "https://github.com/redforks/aliyun-rs"
readme = "README.md"
keywords = ["aliyun", "ali", "cloud", "sdk", "api"]
categories = ["api-bindings", "asynchronous", "web-programming"]

[dependencies]
anyhow = "1"
derive_setters = "0.1.8"
hex = "0.4.3"
hmac = "0.13"
http = "1.5"
reqwest = { version = "0.13.4", default-features = false }
quick-xml = { version = "0.37", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tracing = "0.1"
urlencoding = "2.1"
uuid = { version = "1.19", features = ["v4"] }
strum = { version = "0.28", features = ["derive"] }

[features]
default = ["ocr", "sms", "ecs", "oss", "fc", "rds"]
ocr = []
sms = []
ecs = []
oss = []
fc = []
rds = []

[lib]
doctest = false

[dev-dependencies]
base64 = "0.23.1"
maplit = "1.0.2"
rand = "0.10"
test-log = { version = "0.2.21", features = ["trace"] }
time = { version = "0.3", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
